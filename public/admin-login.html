<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — KLN STUDIO</title><link rel="stylesheet" href="/style.css"></head><body><main class="page"><div class="pagehead"><span class="num">PRIVATE</span><div><h2>Вход в админ-панель</h2><p class="lead">Закрытая страница управления заявками и отзывами.</p></div></div><div class="adminbox" style="max-width:520px"><input id="u" placeholder="Логин" autocomplete="username"><input id="p" type="password" placeholder="Пароль" autocomplete="current-password"><button class="btn primary" onclick="go()">Войти</button><p id="s" class="status"></p><div class="actions"><a class="btn" href="/">← На сайт</a></div></div></main><script>async function go(){const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});if(r.ok)location.href='/admin.html';else s.textContent='Неверный логин или пароль'}p.addEventListener('keydown',e=>{if(e.key==='Enter')go()});</script></body></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админ-панель — KLN STUDIO</title><link rel="stylesheet" href="/style.css"></head><body><main class="page"><div class="pagehead"><span class="num">ADMIN</span><h2>KLN STUDIO</h2></div><div id="root"></div></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function start(){const me=await fetch('/api/me').then(r=>r.json());if(!me.admin){location.href='/admin-login.html';return}dashboard()}async function dashboard(){const d=await fetch('/api/admin/data').then(r=>r.json());root.innerHTML='<div class="admin-grid"><div class="adminbox"><h3>Заявки ('+d.applications.length+')</h3>'+(d.applications.length?d.applications.map(a=>`<div class="item"><b>${esc(a.name)}</b><br>${esc(a.contact)}<br>${esc(a.plan)}${a.template?'<br><span class="muted">Шаблон: '+esc(a.template)+'</span>':''}<br><span class="muted">${esc(a.message||'—')}</span><br><small>${new Date(a.createdAt).toLocaleString('ru-RU')}</small><br><button class="danger" onclick="delA('${a.id}')">Удалить</button></div>`).join(''):'<p class="muted">Заявок пока нет.</p>')+'</div><div class="adminbox"><h3>Отзывы</h3><input id="rn" placeholder="Имя клиента"><input id="rr" placeholder="Компания / роль"><textarea id="rt" placeholder="Текст реального отзыва"></textarea><button class="btn primary" onclick="addR()">Опубликовать</button><h3 style="margin-top:35px">Опубликованные ('+d.reviews.length+')</h3>'+(d.reviews.length?d.reviews.map(x=>`<div class="item"><b>${esc(x.name)}</b>${x.role?' · '+esc(x.role):''}<br>${esc(x.text)}<br><button class="danger" onclick="delR('${x.id}')">Удалить</button></div>`).join(''):'<p class="muted">Пока нет отзывов.</p>')+'</div></div><div class="actions"><button class="btn" onclick="logout()">Выйти</button><a class="btn" href="/">На сайт</a></div>'}async function addR(){const r=await fetch('/api/admin/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:rn.value,role:rr.value,text:rt.value})});if(r.ok)dashboard()}async function delR(id){await fetch('/api/admin/reviews/'+id,{method:'DELETE'});dashboard()}async function delA(id){await fetch('/api/admin/applications/'+id,{method:'DELETE'});dashboard()}async function logout(){await fetch('/api/logout',{method:'POST'});location.href='/admin-login.html'}start();</script></body></html>
